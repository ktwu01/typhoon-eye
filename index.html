<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typhoon Eye · Waterspouts</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05080c; }
      canvas { display: block; cursor: grab; }
      canvas:active { cursor: grabbing; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        color: #9fb3c8; font: 15px/1.4 -apple-system, "PingFang SC", sans-serif; letter-spacing: 0.2em;
        transition: opacity 0.8s;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      .audio-controls {
        position: fixed; left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom)); z-index: 10;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
        box-sizing: border-box; max-width: calc(100vw - 32px); padding: 8px;
        border: 1px solid #50616e; border-radius: 10px;
        background: #071019e6; color: #e5edf3; backdrop-filter: blur(10px);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .audio-toggle {
        min-width: 112px; min-height: 40px; padding: 8px 12px;
        border: 1px solid #778d9c; border-radius: 6px;
        background: #213544; color: inherit; font: inherit; cursor: pointer;
      }
      .audio-toggle:hover { background: #304b60; }
      .audio-toggle:disabled { opacity: 0.65; cursor: default; }
      .audio-toggle:focus-visible, .audio-volume input:focus-visible {
        outline: 2px solid #c4e7ff; outline-offset: 3px;
      }
      .audio-volume { display: flex; align-items: center; gap: 8px; min-height: 40px; }
      .audio-volume input { width: 88px; height: 28px; margin: 0; accent-color: #b1d4ee; cursor: pointer; }
      .audio-volume output { min-width: 4ch; font-variant-numeric: tabular-nums; }
      .audio-status { flex-basis: 100%; margin: 0 4px 2px; color: #e0c39e; }
      @media (max-width: 420px) {
        .audio-controls { gap: 6px 10px; }
        .audio-volume input { width: 70px; }
      }
    </style>
  </head>
  <body>
    <div id="loading">The storm is forming…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
