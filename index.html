<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typhoon Eye · Waterspouts</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05080c; }
      canvas { display: block; cursor: grab; }
      canvas:active { cursor: grabbing; }
      #loading {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: #05080c; color: #9fb3c8; text-align: center;
        font: 15px/1.4 -apple-system, "PingFang SC", sans-serif;
        transition: opacity 0.8s, background-color 0.8s;
      }
      #loading.ready { background: #05080c99; }
      #loading.done { opacity: 0; pointer-events: none; }
      .loading-card { display: grid; gap: 14px; justify-items: center; padding: 24px; }
      .loading-card h1 { margin: 0 0 6px; color: #e5edf3; font-size: 22px; font-weight: 500; letter-spacing: 0.08em; }
      .loading-card p { margin: 0; letter-spacing: 0.2em; }
      #loading-prompt { margin-top: 18px; color: #e5edf3; letter-spacing: 0.05em; }
      .loading-choices { display: flex; gap: 12px; }
      .loading-choices button {
        min-width: 120px; min-height: 44px; padding: 10px 16px;
        border: 1px solid #778d9c; border-radius: 6px;
        background: #213544; color: #e5edf3; font: inherit; cursor: pointer;
      }
      .loading-choices button:hover { background: #304b60; }
      .loading-choices button[aria-pressed="true"] { background: #b1d4ee; border-color: #b1d4ee; color: #071019; }
      .loading-choices button:focus-visible { outline: 2px solid #c4e7ff; outline-offset: 3px; }
      #hud {
        position: fixed; z-index: 10;
        top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
        display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
        max-width: calc(100vw - 24px); max-height: calc(100vh - 24px);
      }
      #hud .lil-gui.root { max-height: calc(100vh - 110px); overflow-y: auto; }
      .audio-controls {
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
        box-sizing: border-box; max-width: 100%; padding: 8px;
        border: 1px solid #50616e; border-radius: 10px;
        background: #071019e6; color: #e5edf3; backdrop-filter: blur(10px);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .audio-toggle {
        min-width: 112px; min-height: 40px; padding: 8px 12px;
        border: 1px solid #778d9c; border-radius: 6px;
        background: #213544; color: inherit; font: inherit; cursor: pointer;
      }
      .audio-toggle:hover { background: #304b60; }
      .audio-toggle:disabled { opacity: 0.65; cursor: default; }
      .audio-toggle:focus-visible, .audio-volume input:focus-visible {
        outline: 2px solid #c4e7ff; outline-offset: 3px;
      }
      .audio-volume { display: flex; align-items: center; gap: 8px; min-height: 40px; }
      .audio-volume input { width: 88px; height: 28px; margin: 0; accent-color: #b1d4ee; cursor: pointer; }
      .audio-volume output { min-width: 4ch; font-variant-numeric: tabular-nums; }
      .audio-status { flex-basis: 100%; margin: 0 4px 2px; color: #e0c39e; }
      @media (max-width: 420px) {
        .audio-controls { gap: 6px 10px; }
        .audio-volume input { width: 70px; }
      }
    </style>
  </head>
  <body>
    <div id="loading" role="dialog" aria-modal="true" aria-labelledby="loading-title">
      <div class="loading-card">
        <h1 id="loading-title" data-i18n="title">Typhoon Eye · Waterspouts</h1>
        <p id="loading-status" role="status" data-i18n="loading">The storm is forming…</p>
        <p id="loading-prompt" data-i18n="soundPrompt">Play with sound?</p>
        <div class="loading-choices">
          <button type="button" data-sound="on" aria-pressed="false" data-i18n="soundOn">Sound on</button>
          <button type="button" data-sound="off" aria-pressed="false" data-i18n="soundOff">Sound off</button>
        </div>
      </div>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
